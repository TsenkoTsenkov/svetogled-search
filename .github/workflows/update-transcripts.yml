name: Weekly Transcript Update

# Checks for new Светоглед episodes, transcribes them,
# commits to the repo, which triggers the deploy workflow.

on:
  schedule:
    - cron: '0 6 * * 3'  # Every Wednesday 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # allows the job to re-trigger itself to drain the backlog

jobs:
  update:
    # The self-hosted runner on the on-prem MacBook Air (see docs/operations.md).
    # GitHub's runners failed here every few weeks: YouTube blocks datacenter
    # IPs (cookie jars expired, then streams were cut off even with fresh
    # cookies), and CPU whisper-small hallucinated over whole talks. From the
    # home IP no cookies are needed, and Metal large-v3-turbo transcribes a
    # 1-hour talk in a few minutes. The deploy shares this single runner, so
    # the deploy triggered at the end queues until this job finishes.
    runs-on: [self-hosted, svetogled]
    timeout-minutes: 180

    env:
      WHISPER_CLI: whisper-cli
      WHISPER_MAX_PER_RUN: '6'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Idempotent: installs only what is missing, so the first run provisions
      # the box and later runs just refresh yt-dlp (YouTube breaks old versions;
      # a March build got HTTP 403 in October).
      - name: Install tools
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          for f in python@3.12 ffmpeg whisper-cpp deno gh; do
            brew list --formula "$f" >/dev/null 2>&1 || brew install "$f"
          done
          # Persistent between runs, beside the live app (docs/operations.md).
          TOOLS_DIR="$HOME/svetogled-server/transcribe"
          mkdir -p "$TOOLS_DIR"
          VENV="$TOOLS_DIR/venv"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/opt/python@3.12/bin/python3.12 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --upgrade "yt-dlp[default]" youtube-transcript-api
          MODEL="$TOOLS_DIR/ggml-large-v3-turbo.bin"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 -o "$MODEL.part" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"
            mv "$MODEL.part" "$MODEL"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "WHISPER_MODEL=$MODEL" >> "$GITHUB_ENV"
          "$VENV/bin/yt-dlp" --version

      # Runs every week, even with no new episode, so a broken toolchain shows
      # up as a red run instead of on the day an episode is missed.
      - name: Smoke-test Whisper and YouTube audio access
        run: |
          set -euo pipefail
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=3" -ar 16000 -ac 1 -y "$RUNNER_TEMP/smoke.wav"
          whisper-cli -m "$WHISPER_MODEL" -l bg -f "$RUNNER_TEMP/smoke.wav" --no-prints > /dev/null
          echo "whisper-cli + model OK"
          # An audio format must be offered for a known talk (Беседа 300; needs
          # the EJS solver + Deno). --simulate downloads nothing.
          yt-dlp --remote-components ejs:github --simulate -f bestaudio --no-playlist \
            "https://www.youtube.com/watch?v=cNgPU9wCx4Y"
          echo "YouTube audio access OK"

      - name: Check for new episodes
        id: check
        run: python scripts/check_new_episodes.py

      - name: Fetch transcripts via YouTube API
        if: steps.check.outputs.new_count > 0
        run: python scripts/fetch_new_transcripts.py

      - name: Transcribe remaining with Whisper
        if: steps.check.outputs.new_count > 0
        run: python scripts/whisper_remaining.py

      - name: Fix common transcription errors
        if: steps.check.outputs.new_count > 0
        run: |
          # Apply Bulgarian corrections only to the newly added transcripts.
          # scripts/correct_transcripts.py takes transcript file paths as args.
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          videos = json.loads(Path("new_videos.json").read_text(encoding="utf-8"))
          files = [
              str(p) for v in videos
              if (p := Path("transcripts") / f"{v['id']}.json").exists()
          ]
          if not files:
              print("No new transcript files to correct.")
              sys.exit(0)
          print(f"Correcting {len(files)} new transcript(s)...")
          subprocess.run([sys.executable, "scripts/correct_transcripts.py", *files], check=True)
          PY

      - name: Normalize titles and add playlist order
        if: steps.check.outputs.new_count > 0
        run: python scripts/normalize_titles.py

      - name: Regenerate theme map
        if: steps.check.outputs.new_count > 0
        run: python scripts/generate_themes.py

      - name: Commit and push new transcripts
        if: steps.check.outputs.new_count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/ themes.json
          if git diff --staged --quiet; then
            # new_count > 0 got us here, yet nothing was produced — transcription
            # failed (e.g. YouTube blocked audio download). Fail LOUDLY instead
            # of the old silent "success", which hid Беседи 288-291 for weeks.
            echo "::error::${{ steps.check.outputs.new_count }} new episode(s) were" \
                 "detected but NONE were transcribed — nothing to commit. The audio" \
                 "download or transcription step failed (see the yt-dlp/whisper logs" \
                 "above). Failing the job so this is not silently missed."
            exit 1
          fi
          COUNT=$(git diff --staged --name-only | wc -l)
          git commit -m "Add ${COUNT} new transcript(s) from weekly update"
          git push

      # A push made with the default GITHUB_TOKEN does NOT trigger other
      # workflows (GitHub's loop-prevention rule), so the deploy workflow does
      # NOT fire on the bot's transcript commit — the episodes would sit in the
      # repo but never reach the live server (exactly what happened with
      # Беседи 288-291). Trigger the deploy explicitly.
      # This step is only reached after the commit step actually committed new
      # transcripts (it exit 1's otherwise), so a deploy is always warranted.
      - name: Trigger deploy
        if: steps.check.outputs.new_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy so the new transcripts reach the live site."
          gh workflow run deploy.yml

      # If Whisper capped this run (WHISPER_MAX_PER_RUN) and episodes still
      # remain, re-trigger this same workflow so the backlog drains over a few
      # short runs instead of one run that times out. The just-pushed commit
      # means the next run's check sees fewer "new" episodes.
      - name: Re-trigger if episodes remain
        if: steps.check.outputs.new_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recompute the backlog against the transcripts we just committed.
          git pull --quiet --rebase origin main || true
          REMAINING=$(python scripts/check_new_episodes.py 2>/dev/null \
            | grep -oE 'New episodes: [0-9]+' | grep -oE '[0-9]+' || echo 0)
          echo "Episodes still needing transcription: ${REMAINING:-0}"
          if [ "${REMAINING:-0}" -gt 0 ]; then
            echo "Re-triggering weekly update to process the remaining ${REMAINING}."
            gh workflow run update-transcripts.yml
          else
            echo "Backlog empty — all new episodes transcribed."
          fi

