            /** The paragraph whose text is at the top / middle / bottom of the view. */
            function paraAtViewport(which) {
                var pane = el("paras");
                var p = pane.getBoundingClientRect();
                var y =
                    which === "high"
                        ? p.top + 8
                        : which === "low"
                          ? p.bottom - 8
                          : p.top + p.height / 2;
                var best = vim.para;
                for (var i = 0; i < vim.tas.length; i++) {
                    var r = vim.tas[i].getBoundingClientRect();
                    if (r.bottom >= y) {
                        best = i;
                        break;
                    }
                    best = i;
                }
                return best;
            }

            function motionFor(k, count, forOp, counted) {
                var L = LAY();
                var t = paraText(vim.para);
                var p = vim.para;
                var o = vim.off;
                var n = t.length;
                var big = k === "W" || k === "B" || k === "E";
                var i;

                switch (k) {
                    case L.left:
                    case "ArrowLeft":
                    case "Backspace":
                        return { para: p, off: Math.max(0, o - count), kind: "excl" };
                    case L.right:
                    case "ArrowRight":
                    case " ":
                        return { para: p, off: Math.min(n, o + count), kind: "excl" };
                    case L.down:
                    case "ArrowDown":
                        return {
                            para: Math.min(paraCount() - 1, p + count),
                            off: 0,
                            kind: "line",
                        };
                    case L.up:
                    case "ArrowUp":
                        return { para: Math.max(0, p - count), off: 0, kind: "line" };
                    case "0":
                        return { para: p, off: VimText.lineStart(t, o), kind: "excl" };
                    case "^":
                        return { para: p, off: VimText.firstNonBlank(t, o), kind: "excl" };
                    case "$":
                        for (i = 1; i < count; i++)
                            o = Math.min(n, VimText.lineEnd(t, o) + 1);
                        return { para: p, off: VimText.lineEnd(t, o), kind: "excl" };
                    case "w":
                    case "W":
                        for (i = 0; i < count; i++) {
                            var nx = VimText.wordFwd(t, o, big);
                            if (nx >= t.length && !forOp && p + 1 < paraCount()) {
                                p++;
                                t = paraText(p);
                                o = VimText.firstNonBlank(t, 0);
                            } else o = nx;
                        }
                        return { para: p, off: o, kind: "excl" };
                    case "b":
                    case "B":
                        for (i = 0; i < count; i++) {
                            if (o === 0 && !forOp && p > 0) {
                                p--;
                                t = paraText(p);
                                o = VimText.wordBack(t, t.length, big);
                            } else o = VimText.wordBack(t, o, big);
                        }
                        return { para: p, off: o, kind: "excl" };
                    case "e":
                    case "E":
                        for (i = 0; i < count; i++) {
                            var ne = VimText.wordEnd(t, o, big);
                            if (ne <= o && !forOp && p + 1 < paraCount()) {
                                p++;
                                t = paraText(p);
                                o = VimText.wordEnd(t, -1, big);
                            } else o = ne;
                        }
                        return { para: p, off: o, kind: "incl" };
                    case "{":
                        return {
                            para: Math.max(0, p - count),
                            off: 0,
                            kind: "excl",
                            jump: true,
                        };
                    case "}":
                        return {
                            para: Math.min(paraCount() - 1, p + count),
                            off: 0,
                            kind: "excl",
                            jump: true,
                        };
                    case ")":
                        for (i = 0; i < count; i++) {
                            var sf = VimText.sentenceFwd(t, o);
                            if (sf >= n && p + 1 < paraCount() && !forOp) {
                                p++;
                                t = paraText(p);
                                o = 0;
                            } else o = sf;
                        }
                        return { para: p, off: o, kind: "excl" };
                    case "(":
                        for (i = 0; i < count; i++) {
                            if (o === 0 && p > 0 && !forOp) {
                                p--;
                                t = paraText(p);
                                o = VimText.sentenceBack(t, t.length);
                            } else o = VimText.sentenceBack(t, o);
                        }
                        return { para: p, off: o, kind: "excl" };
                    case "%":
                        i = VimText.matchPair(t, o);
                        return i < 0 ? null : { para: p, off: i, kind: "incl", jump: true };
                    case "G":
                        return {
                            para: counted
                                ? Math.min(paraCount() - 1, count - 1)
                                : paraCount() - 1,
                            off: 0,
                            kind: "line",
                            jump: true,
                        };
                    case L.high:
                        return { para: paraAtViewport("high"), off: 0, kind: "line", jump: true };
                    case "M":
                        return { para: paraAtViewport("mid"), off: 0, kind: "line", jump: true };
                    case L.low:
                        return { para: paraAtViewport("low"), off: 0, kind: "line", jump: true };
                    case "Enter":
                        return {
                            para: Math.min(paraCount() - 1, p + count),
                            off: 0,
                            kind: "line",
                        };
                    default:
                        return null;
                }
            }

            /** f F t T and their repeats. */
            function findMotion(ch, backward, till, count) {
                var t = paraText(vim.para);
                var i = VimText.findChar(t, vim.off, ch, backward, till, count);
                if (i < 0) {
                    say("Няма „" + ch + "“ в този абзац.", "bad");
                    return null;
                }
                return { para: vim.para, off: i, kind: backward ? "excl" : "incl" };
            }

            // ── vim: operators ────────────────────────────────────────────────────

            function sliceRange(from, to, linewise) {
                var out = [];
                var i;
                if (linewise) {
                    for (i = from.para; i <= to.para; i++)
                        out.push({ para: i, start: 0, end: paraText(i).length });
                    return out;
                }
                if (from.para === to.para)
                    return [{ para: from.para, start: from.off, end: to.off }];
                out.push({
                    para: from.para,
                    start: from.off,
                    end: paraText(from.para).length,
                });
                for (i = from.para + 1; i < to.para; i++)
                    out.push({ para: i, start: 0, end: paraText(i).length });
                out.push({ para: to.para, start: 0, end: to.off });
                return out;
            }

            function sliceText(slices) {
                return slices
                    .map(function (s) {
                        return paraText(s.para).slice(s.start, s.end);
                    })
                    .join("\n");
            }

            function applyOp(op, a, b, kind) {
                var from = a;
                var to = b;
                if (from.para > to.para || (from.para === to.para && from.off > to.off)) {
                    from = b;
                    to = a;
                }
                if (kind === "incl")
                    to = {
                        para: to.para,
                        off: Math.min(paraText(to.para).length, to.off + 1),
                    };
                var linewise = kind === "line";
                var slices = sliceRange(from, to, linewise);
                var text = sliceText(slices);
                vim.op = null;
                vim.opCount = "";
                leaveVisual();

                if (op === "y") {
                    yankTo(text, linewise);
                    flashYank(slices);
                    setCursor(from.para, linewise ? vim.off : from.off);
                    say(
                        linewise
                            ? slices.length + (slices.length === 1 ? " абзац" : " абзаца") + " в паметта."
                            : text.split(/\s+/).filter(Boolean).length + " думи в паметта.",
                    );
                    return true;
                }
                if (op === "gu" || op === "gU" || op === "g~") {
                    markChange();
                    beginEdit();
                    slices.forEach(function (s) {
                        var t = paraText(s.para);
                        var mid = t.slice(s.start, s.end);
                        mid =
                            op === "gu"
                                ? mid.toLowerCase()
                                : op === "gU"
                                  ? mid.toUpperCase()
                                  : VimText.swapCase(mid);
                        setPara(s.para, t.slice(0, s.start) + mid + t.slice(s.end));
                    });
                    commitEdit();
                    setCursor(from.para, from.off);
                    return true;
                }
                // d and c
                markChange();
                yankTo(text, linewise && op === "d");
                beginEdit();
                for (var j = slices.length - 1; j >= 0; j--) {
                    var s = slices[j];
                    var t0 = paraText(s.para);
                    setPara(s.para, t0.slice(0, s.start) + t0.slice(s.end));
                }
                setCursor(from.para, linewise ? 0 : from.off);
                // Insert may sit one past the last character; the normal-mode clamp in
                // setCursor may not, so c re-places the cursor after switching modes.
                if (op === "c") enterInsert(linewise ? 0 : from.off);
                else commitEdit();
                return true;
            }

            // ── vim: insert mode ──────────────────────────────────────────────────

            function enterInsert(at) {
                beginEdit();
                touch(vim.para);
                vim.mode = "insert";
                if (at !== undefined)
                    vim.off = Math.max(0, Math.min(paraText(vim.para).length, at));
                vim.insert = { para: vim.para, before: paraText(vim.para) };
                var ta = vim.tas[vim.para];
                if (ta) {
                    ta.focus({ preventScroll: true });
                    ta.setSelectionRange(vim.off, vim.off);
                }
                clearVisual();
                vimBadge();
                drawCaret();
            }

            function leaveInsert() {
                if (vim.mode !== "insert") return;
                var ta = vim.tas[vim.para];
                var off = ta ? ta.selectionStart : vim.off;
                if (vim.insert && vim.changeOpen && vim.change) {
                    var a = vim.insert.before;
                    var b = paraText(vim.insert.para);
                    var s = 0;
                    while (s < a.length && s < b.length && a.charAt(s) === b.charAt(s)) s++;
                    var t = 0;
                    while (
                        t < a.length - s &&
                        t < b.length - s &&
                        a.charAt(a.length - 1 - t) === b.charAt(b.length - 1 - t)
                    )
                        t++;
                    vim.change.insert = b.slice(s, b.length - t);
                }
                vim.insert = null;
                vim.changeOpen = false;
                vim.mode = "normal";
                commitEdit();
                setCursor(vim.para, Math.max(0, off - 1));
            }

            function leaveVisual() {
                if (vim.mode === "visual" || vim.mode === "vline") {
                    vim.mode = "normal";
                    vim.anchor = null;
                    clearVisual();
                }
            }

            // ── vim: the dot ──────────────────────────────────────────────────────

            function markChange() {
                if (vim.replaying) return;
                vim.change = { keys: vim.keys.slice(), insert: null };
                vim.changeOpen = true;
            }

            function repeatChange() {
                var c = vim.change;
                if (!c || !c.keys.length) {
                    say("Няма какво да се повтори.");
                    return;
                }
                vim.replaying = true;
                try {
                    for (var i = 0; i < c.keys.length; i++) dispatch(c.keys[i], null);
                    if (vim.mode === "insert") {
                        if (c.insert) {
                            insertAt(vim.para, vim.off, c.insert);
                            setCursor(vim.para, vim.off + c.insert.length);
                        }
                        leaveInsert();
                    }
                } finally {
                    vim.replaying = false;
                    vim.await = null;
                    vim.op = null;
                }
            }

            // ── vim: search ───────────────────────────────────────────────────────

            function findMatch(pat, start, backward) {
                var n = paraCount();
                if (!n || !pat) return null;
                var i, idx, from;
                for (var step = 0; step <= n; step++) {
                    if (!backward) {
                        i = (start.para + step) % n;
                        from = step === 0 ? start.off : 0;
                        idx = VimText.searchIn(paraText(i), pat, from, false);
                    } else {
                        i = ((start.para - step) % n + n) % n;
                        from = step === 0 ? start.off : paraText(i).length;
                        idx = VimText.searchIn(paraText(i), pat, from, true);
                    }
                    if (idx >= 0)
                        return {
                            para: i,
                            off: idx,
                            wrapped: backward ? i > start.para : step > 0 && i <= start.para,
                        };
                }
                return null;
            }

            function jumpToMatch(hit, pat, quiet) {
                if (!hit) {
                    if (!quiet) say("Няма „" + pat + "“ в тази беседа.", "bad");
                    return false;
                }
                setCursor(hit.para, hit.off);
                var ta = vim.tas[hit.para];
                if (ta) ta.setSelectionRange(hit.off, hit.off + pat.length);
                ensureVisible("center");
                if (!quiet)
                    say(
                        hit.wrapped
                            ? "…и продължава от другия край."
                            : "абзац " + (hit.para + 1) + " от " + paraCount(),
                    );
                return true;
            }

            function seekOpen(dir) {
                if (!paraCount()) return;
                vim.search.dir = dir;
                vim.search.from = { para: vim.para, off: vim.off };
                vim.search.histAt = -1;
                el("seek-sig").textContent = dir > 0 ? "/" : "?";
                el("seek").classList.add("on");
                var input = el("seek-input");
                input.value = "";
                input.focus();
                vimBadge();
            }

            function seekClose(cancel) {
                var pat = el("seek-input").value;
                el("seek").classList.remove("on");
                el("seek-input").blur();
                if (cancel || !pat) {
                    var f = vim.search.from;
                    if (f) setCursor(f.para, f.off);
                    say("");
                } else {
                    vim.search.pat = pat;
                    if (vim.search.hist[vim.search.hist.length - 1] !== pat)
                        vim.search.hist.push(pat);
                    jumpToMatch(
                        findMatch(pat, vim.search.from, vim.search.dir < 0),
                        pat,
                        false,
                    );
                }
                focusPara(vim.para);
                vimSync();
            }

            function seekLive() {
                var pat = el("seek-input").value;
                if (!pat) {
                    var f = vim.search.from;
                    if (f) setCursor(f.para, f.off);
                    return;
                }
                var start = vim.search.from;
                if (vim.search.dir > 0)
                    start = { para: start.para, off: start.off + 1 };
                else start = { para: start.para, off: Math.max(0, start.off - 1) };
                jumpToMatch(findMatch(pat, start, vim.search.dir < 0), pat, true);
            }

            function seekNext(back) {
                var pat = vim.search.pat;
                if (!pat) {
                    say("Още не е търсено нищо.");
                    return;
                }
                var backward = back ? vim.search.dir > 0 : vim.search.dir < 0;
                var start = backward
                    ? { para: vim.para, off: vim.off - 1 }
                    : { para: vim.para, off: vim.off + 1 };
                jumpToMatch(findMatch(pat, start, backward), pat, false);
            }

            function seekWord(back) {
                var w = VimText.wordAt(paraText(vim.para), vim.off);
                if (!w) return;
                vim.search.pat = w;
                vim.search.dir = back ? -1 : 1;
                seekNext(false);
            }

            // ── vim: the jump list ────────────────────────────────────────────────

            function pushJump() {
                vim.jumps = vim.jumps.slice(0, vim.jumpAt + 1);
                vim.jumps.push({ para: vim.para, off: vim.off });
                if (vim.jumps.length > 60) vim.jumps.shift();
                vim.jumpAt = vim.jumps.length;
            }

            function jumpBack(forward) {
                if (forward) {
                    if (vim.jumpAt >= vim.jumps.length - 1) return;
                    vim.jumpAt++;
                } else {
                    if (vim.jumpAt <= 0) return;
                    if (vim.jumpAt >= vim.jumps.length) {
                        vim.jumps.push({ para: vim.para, off: vim.off });
                        vim.jumpAt = vim.jumps.length - 1;
                    }
                    vim.jumpAt--;
                }
                var at = vim.jumps[vim.jumpAt];
                if (at) {
                    setCursor(at.para, at.off);
                    ensureVisible("center");
                }
            }

            // ── vim: the commands ─────────────────────────────────────────────────

            function vimEscape() {
                if (vim.mode === "insert") return leaveInsert();
                if (vim.mode === "visual" || vim.mode === "vline") {
                    leaveVisual();
                    vimSync();
                    return;
                }
                vim.count = "";
                vim.op = null;
                vim.opCount = "";
                vim.await = null;
                vim.awaitArg = false;
                vim.keys = [];
                say("");
                vimSync();
            }

            function awaitChar(fn) {
                vim.await = fn;
                vim.awaitArg = true;
            }

            function doPaste(after, count) {
                if (!vim.reg.text) {
                    say("Паметта е празна.");
                    return true;
                }
                var text = "";
                for (var i = 0; i < count; i++) text += vim.reg.text;
                markChange();
                beginEdit();
                var t = paraText(vim.para);
                if (vim.reg.linewise) {
                    var at = after
                        ? VimText.lineEnd(t, vim.off)
                        : VimText.lineStart(t, vim.off);
                    setPara(
                        vim.para,
                        t.slice(0, at) + (after ? "\n" + text : text + "\n") + t.slice(at),
                    );
                    setCursor(vim.para, at + (after ? 1 : 0));
                } else {
                    var at2 = after ? Math.min(t.length, vim.off + 1) : vim.off;
                    setPara(vim.para, t.slice(0, at2) + text + t.slice(at2));
                    setCursor(vim.para, at2 + text.length - 1);
                }
                commitEdit();
                return true;
            }

            /**
             * K — join. Inside a paragraph it joins its lines; at the end of one it
             * pulls the next paragraph in. That second case moves words across a time
             * boundary, so it says so.
             */
            function doJoin(count) {
                markChange();
                beginEdit();
                for (var c = 0; c < Math.max(1, count - 1); c++) {
                    var t = paraText(vim.para);
                    var le = VimText.lineEnd(t, vim.off);
                    if (le < t.length) {
                        var rest = t.slice(le + 1).replace(/^\s+/, "");
                        setPara(vim.para, t.slice(0, le) + " " + rest);
                        setCursor(vim.para, le);
                    } else if (vim.para + 1 < paraCount()) {
                        var next = paraText(vim.para + 1).trim();
                        var head = t.replace(/\s+$/, "");
                        setPara(vim.para, next ? head + " " + next : head);
                        setPara(vim.para + 1, "");
                        setCursor(vim.para, Math.max(0, head.length));
                        say("Следващият абзац е слят в този — времената му остават без думи.");
                    } else break;
                }
                commitEdit();
                return true;
            }

            /** U — the ↺ button: this paragraph as the transcript had it. */
            function revertPara() {
                var orig = state.original[vim.para];
                if (orig === undefined || orig === paraText(vim.para)) {
                    say("Абзацът е непроменен.");
                    return true;
                }
                markChange();
                beginEdit();
                setPara(vim.para, orig);
                commitEdit();
                setCursor(vim.para, Math.min(vim.off, Math.max(0, orig.length - 1)));
                say("Абзацът е върнат в оригинала.", "ok");
                return true;
            }

            function scrollPage(frac, dir) {
                var ta = vim.tas[vim.para];
                if (!ta) return true;
                var lh = VimMirror.rectAt(ta, 0).height || 24;
                var rows = Math.max(1, Math.round((el("paras").clientHeight * frac) / lh));
                moveVert(dir, rows);
                ensureVisible("center");
                return true;
            }

            function ctrlCommand(k) {
                switch (k) {
                    case "r":
                        undoStep(true);
                        return true;
                    case "d":
                        return scrollPage(0.5, 1);
                    case "u":
                        return scrollPage(0.5, -1);
                    case "f":
                        return scrollPage(0.9, 1);
                    case "b":
                        return scrollPage(0.9, -1);
                    case "o":
                        jumpBack(false);
                        return true;
                    case "i":
                        jumpBack(true);
                        return true;
                    default:
                        return false;
                }
            }

            /** One keystroke of normal or visual mode. */
            function dispatch(k, e) {
                var L = LAY();
                var ctrl = !!(e && e.ctrlKey && !e.metaKey && !e.altKey);
                var vis = vim.mode === "visual" || vim.mode === "vline";
                var i;

                if (vim.await) {
                    var fn = vim.await;
                    var wantChar = vim.awaitArg;
                    vim.await = null;
                    vim.awaitArg = false;
                    var arg = wantChar && e && e.key && e.key.length === 1 ? e.key : k;
                    return fn(arg, e) !== false;
                }
                if (k === "Escape") {
                    vimEscape();
                    return true;
                }
                if (ctrl) {
                    if (k === "[") {
                        vimEscape();
                        return true;
                    }
                    return ctrlCommand(k);
                }
                if (/[1-9]/.test(k) || (k === "0" && vim.count !== "")) {
                    vim.count += k;
                    return true;
                }

                var counted = vim.count !== "";
                var count = counted ? Math.max(1, parseInt(vim.count, 10)) : 1;
                vim.count = "";
                if (vim.op && vim.opCount) count *= Number(vim.opCount);

                // ── operators ──
                if (k === "d" || k === "c" || k === "y") {
                    if (vis) {
                        var r = visualRange();
                        return applyOp(k, r.from, r.to, r.kind);
                    }
                    if (vim.op === k) {
                        var last = Math.min(paraCount() - 1, vim.para + count - 1);
                        return applyOp(
                            k,
                            { para: vim.para, off: 0 },
                            { para: last, off: 0 },
                            "line",
                        );
                    }
                    if (vim.op) {
                        vim.op = null;
                        vim.opCount = "";
                        return true;
                    }
                    vim.op = k;
                    vim.opCount = String(count);
                    return true;
                }
                if ((k === "i" || k === "a") && (vim.op || vis)) {
                    var inner = k === "i";
                    vim.await = function (key) {
                        var obj = VimText.textObject(
                            paraText(vim.para),
                            vim.off,
                            key,
                            inner,
                        );
                        if (!obj) {
                            vim.op = null;
                            say("Тук няма такъв обект.");
                            return true;
                        }
                        if (vis) {
                            vim.anchor = { para: vim.para, off: obj.start };
                            setCursor(vim.para, Math.max(obj.start, obj.end - 1));
                            return true;
                        }
                        return applyOp(
                            vim.op,
                            { para: vim.para, off: obj.start },
                            { para: vim.para, off: obj.end },
                            "excl",
                        );
                    };
                    return true;
                }

                // ── entering insert ──
                if (!vim.op && !vis) {
                    if (k === "i" || k === "a" || k === "I" || k === "A") {
                        var t0 = paraText(vim.para);
                        var at =
                            k === "i"
                                ? vim.off
                                : k === "a"
                                  ? vim.off + (t0.length ? 1 : 0)
                                  : k === "I"
                                    ? VimText.firstNonBlank(t0, vim.off)
                                    : VimText.lineEnd(t0, vim.off);
                        markChange();
                        enterInsert(at);
                        return true;
                    }
                    if (k === "o" || k === "O") {
                        var t1 = paraText(vim.para);
                        var pos =
                            k === "o"
                                ? VimText.lineEnd(t1, vim.off)
                                : VimText.lineStart(t1, vim.off);
                        markChange();
                        beginEdit();
                        setPara(
                            vim.para,
                            t1.slice(0, pos) + "\n" + t1.slice(pos),
                        );
                        enterInsert(k === "o" ? pos + 1 : pos);
                        return true;
                    }
                }

                // ── small edits ──
                if (k === "x" || k === "X" || k === "s") {
                    if (vis) return applyOpVisual(k === "s" ? "c" : "d");
                    var t2 = paraText(vim.para);
                    var from =
                        k === "X"
                            ? { para: vim.para, off: Math.max(0, vim.off - count) }
                            : { para: vim.para, off: vim.off };
                    var to =
                        k === "X"
                            ? { para: vim.para, off: vim.off }
                            : { para: vim.para, off: Math.min(t2.length, vim.off + count) };
                    if (from.off === to.off) return true;
                    applyOp(k === "s" ? "c" : "d", from, to, "excl");
                    return true;
                }
                if (k === "S") {
                    vim.op = "c";
                    vim.opCount = String(count);
                    return dispatch("c", e);
                }
                if (k === "D" || k === "C") {
                    var t3 = paraText(vim.para);
                    return applyOp(
                        k === "D" ? "d" : "c",
                        { para: vim.para, off: vim.off },
                        { para: vim.para, off: VimText.lineEnd(t3, vim.off) },
                        "excl",
                    );
                }
                if (k === "Y") {
                    return applyOp(
                        "y",
                        { para: vim.para, off: 0 },
                        { para: Math.min(paraCount() - 1, vim.para + count - 1), off: 0 },
                        "line",
                    );
                }
                if (k === "p" || k === "P") {
                    if (vis) {
                        var rv = visualRange();
                        var held = { text: vim.reg.text, linewise: vim.reg.linewise };
                        applyOp("d", rv.from, rv.to, rv.kind);
                        vim.reg = held;
                        return doPaste(false, count);
                    }
                    return doPaste(k === "p", count);
                }
                if (k === "r") {
                    awaitChar(function (ch) {
                        if (!ch || ch.length !== 1) return true;
                        markChange();
                        beginEdit();
                        if (vis) {
                            var rr = visualRange();
                            sliceRange(rr.from, rr.to, rr.kind === "line").forEach(
                                function (s) {
                                    var tt = paraText(s.para);
                                    var mid = tt
                                        .slice(s.start, s.end)
                                        .replace(/[^\n]/g, ch);
                                    setPara(
                                        s.para,
                                        tt.slice(0, s.start) + mid + tt.slice(s.end),
                                    );
                                },
                            );
                            leaveVisual();
                            setCursor(rr.from.para, rr.from.off);
                        } else {
                            var t4 = paraText(vim.para);
                            if (vim.off + count > t4.length) return true;
                            var rep = new Array(count + 1).join(ch);
                            setPara(
                                vim.para,
                                t4.slice(0, vim.off) + rep + t4.slice(vim.off + count),
                            );
                            setCursor(vim.para, vim.off + count - 1);
                        }
                        commitEdit();
                        return true;
                    });
                    return true;
                }
                if (k === "~") {
                    if (vis) return applyOpVisual("g~");
                    var t5 = paraText(vim.para);
                    var end = Math.min(t5.length, vim.off + count);
                    markChange();
                    beginEdit();
                    setPara(
                        vim.para,
                        t5.slice(0, vim.off) +
                            VimText.swapCase(t5.slice(vim.off, end)) +
                            t5.slice(end),
                    );
                    commitEdit();
                    setCursor(vim.para, end);
                    return true;
                }
                if (vis && (k === "u" || k === "U")) return applyOpVisual(k === "u" ? "gu" : "gU");
                if (k === "u") {
                    undoStep(false);
                    return true;
                }
                if (k === "U") return revertPara();
                if (k === L.join) return doJoin(count);
                if (k === ".") {
                    repeatChange();
                    return true;
                }

                // ── visual mode ──
                if (k === "v" || k === "V") {
                    var want = k === "v" ? "visual" : "vline";
                    if (vim.mode === want) {
                        leaveVisual();
                        vimSync();
                    } else {
                        vim.anchor = vis ? vim.anchor : { para: vim.para, off: vim.off };
                        vim.mode = want;
                        vimSync();
                    }
                    return true;
                }
                if (vis && k === "o") {
                    var a = vim.anchor;
                    vim.anchor = { para: vim.para, off: vim.off };
                    setCursor(a.para, a.off);
                    return true;
                }

                // ── search ──
                if (k === "/" || k === "?") {
                    seekOpen(k === "/" ? 1 : -1);
                    return true;
                }
                if (k === "n" || k === "N") {
                    seekNext(k === "N");
                    return true;
                }
                if (k === "*" || k === "#") {
                    seekWord(k === "#");
                    return true;
                }

                // ── f F t T and their repeats ──
                if (k === "f" || k === "F" || k === "t" || k === "T") {
                    var backward = k === "F" || k === "T";
                    var till = k === "t" || k === "T";
                    awaitChar(function (ch) {
                        if (!ch || ch.length !== 1) return true;
                        vim.find = { ch: ch, backward: backward, till: till };
                        var m = findMotion(ch, backward, till, count);
                        if (!m) {
                            vim.op = null;
                            return true;
                        }
                        return finishMotion(m);
                    });
                    return true;
                }
                if ((k === L.again || k === L.back) && vim.find) {
                    var f = vim.find;
                    var flip = k === L.back;
                    var m2 = findMotion(
                        f.ch,
                        flip ? !f.backward : f.backward,
                        f.till,
                        count,
                    );
                    if (!m2) {
                        vim.op = null;
                        return true;
                    }
                    return finishMotion(m2);
                }

                // ── g… and z… ──
                if (k === "g") {
                    vim.await = function (key) {
                        if (key === "g") {
                            var target = counted
                                ? Math.min(paraCount() - 1, count - 1)
                                : 0;
                            return finishMotion({
                                para: target,
                                off: 0,
                                kind: "line",
                                jump: true,
                            });
                        }
                        if (key === "e" || key === "E") {
                            var t6 = paraText(vim.para);
                            var o6 = vim.off;
                            for (i = 0; i < count; i++)
                                o6 = VimText.wordEndBack(t6, o6, key === "E");
                            return finishMotion({
                                para: vim.para,
                                off: o6,
                                kind: "incl",
                            });
                        }
                        if (key === "u" || key === "U" || key === "~") {
                            var op = "g" + (key === "~" ? "~" : key);
                            if (vis) return applyOpVisual(op);
                            vim.op = op;
                            vim.opCount = String(count);
                            return true;
                        }
                        if (key === "?") {
                            vimHelp();
                            return true;
                        }
                        vim.op = null;
                        return true;
                    };
                    return true;
                }
                if (k === "z") {
                    vim.await = function (key) {
                        if (key === "z") ensureVisible("center");
                        else if (key === "t") ensureVisible("top");
                        else if (key === "b") ensureVisible("bottom");
                        return true;
                    };
                    return true;
                }

                // ── plain movement ──
                if (!vim.op && (k === L.down || k === "ArrowDown")) {
                    moveVert(1, count);
                    return true;
                }
                if (!vim.op && (k === L.up || k === "ArrowUp")) {
                    moveVert(-1, count);
                    return true;
                }
                if (k === "G" && !counted) {
                    return finishMotion({
                        para: paraCount() - 1,
                        off: 0,
                        kind: "line",
                        jump: true,
                    });
                }
                // vim's one deliberate inconsistency: cw on a word changes
                // the word, not the space after it — it behaves like ce.
                var mk = k;
                if (
                    vim.op === "c" &&
                    (k === "w" || k === "W") &&
                    VimText.klass(
                        paraText(vim.para).charAt(vim.off),
                        k === "W",
                    ) !== 0
                )
                    mk = k === "w" ? "e" : "E";
                var m3 = motionFor(mk, count, !!vim.op, counted);
                if (m3) return finishMotion(m3);
                if (vim.op) {
                    vim.op = null;
                    vim.opCount = "";
                }
                return false;
            }

            function applyOpVisual(op) {
                var r = visualRange();
                return applyOp(op, r.from, r.to, r.kind);
            }

            /** A motion either moves the cursor or feeds the pending operator. */
            function finishMotion(m) {
                if (vim.op) return applyOp(vim.op, { para: vim.para, off: vim.off }, m, m.kind);
                if (m.jump) pushJump();
                setCursor(m.para, m.off);
                return true;
            }

            function handleKey(k, e) {
                if (!vim.replaying)
                    vim.keys.push(
                        vim.awaitArg && e && e.key && e.key.length === 1 ? e.key : k,
                    );
                var handled = dispatch(k, e);
                if (
                    !vim.await &&
                    !vim.op &&
                    vim.count === "" &&
                    vim.mode !== "insert" &&
                    !vim.replaying
                )
                    vim.keys = [];
                vim.cmd = vim.keys.join("");
                vimBadge();
                return handled;
            }

            // ── vim: панели ───────────────────────────────────────────────────────

            function paneClasses() {
                document
                    .querySelector("aside")
                    .classList.toggle("pane-on", vim.pane === "list");
                document
                    .querySelector("section.editor")
                    .classList.toggle("pane-on", vim.pane === "editor");
            }

            function gotoPane(which) {
                if (el("seek").classList.contains("on")) seekClose(true);
                vim.pane = which;
                paneClasses();
                if (which === "list") {
                    if (vim.mode === "insert") leaveInsert();
                    var ta = vim.tas[vim.para];
                    if (ta) ta.blur();
                    el("filter").blur();
                    el("ep-list").focus({ preventScroll: true });
                    listSyncToOpen();
                    listPaint(true);
                    drawCaret();
                    say("беседи · " + LAY().down + "/" + LAY().up + " движение · enter отваря · / търси");
                } else {
                    listPaint(false);
                    focusPara(vim.para);
                    vimSync();
                    say("");
                }
            }

            function listSyncToOpen() {
                if (!state.current) return;
                var at = vim.listIds.indexOf(state.current.video_id);
                if (at >= 0) vim.listCursor = at;
            }

            function listPaint(scroll) {
                var list = el("ep-list");
                var rows = list.querySelectorAll(".ep");
                for (var i = 0; i < rows.length; i++)
                    rows[i].classList.toggle(
                        "cursor",
                        i === vim.listCursor && vim.pane === "list",
                    );
                var row = rows[vim.listCursor];
                if (row && scroll) {
                    var box = list.getBoundingClientRect();
                    var r = row.getBoundingClientRect();
                    if (r.top < box.top) list.scrollTop += r.top - box.top - 8;
                    else if (r.bottom > box.bottom)
                        list.scrollTop += r.bottom - box.bottom + 8;
                }
            }

            function listGo(i) {
                if (!vim.listIds.length) return;
                vim.listCursor = Math.max(0, Math.min(vim.listIds.length - 1, i));
                listPaint(true);
            }

            function openCursorEpisode() {
                var id = vim.listIds[vim.listCursor];
                if (!id) return;
                vim.toEditorAfterOpen = true;
                if (state.current && state.current.video_id === id) {
                    gotoPane("editor");
                    vim.toEditorAfterOpen = false;
                    return;
                }
                openEpisode(id);
            }

            function listKeys(e, k) {
                var L = LAY();
                var handled = true;
                if (vim.listAwait) {
                    var fn = vim.listAwait;
                    vim.listAwait = null;
                    fn(k);
                } else if (k === L.down || e.key === "ArrowDown")
                    listGo(vim.listCursor + (e.ctrlKey ? 8 : 1));
                else if (k === L.up || e.key === "ArrowUp")
                    listGo(vim.listCursor - (e.ctrlKey ? 8 : 1));
                else if (e.ctrlKey && k === "d") listGo(vim.listCursor + 8);
                else if (e.ctrlKey && k === "u") listGo(vim.listCursor - 8);
                else if (k === "g")
                    vim.listAwait = function (x) {
                        if (x === "g") listGo(0);
                    };
                else if (k === "G") listGo(vim.listIds.length - 1);
                else if (k === "/") {
                    el("filter").focus();
                    el("filter").select();
                } else if (e.key === "Enter" || k === "o" || k === L.right)
                    openCursorEpisode();
                else if (e.key === "Escape") {
                    if (el("filter").value) {
                        el("filter").value = "";
                        vim.listCursor = 0;
                        renderEpisodes();
                        listPaint(true);
                    } else gotoPane("editor");
                } else handled = false;
                if (handled) e.preventDefault();
            }

            function filterKeys(e) {
                if (e.key === "Escape") {
                    e.preventDefault();
                    gotoPane("list");
                } else if (e.key === "Enter") {
                    e.preventDefault();
                    openCursorEpisode();
                } else if (e.key === "ArrowDown") {
                    e.preventDefault();
                    listGo(vim.listCursor + 1);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    listGo(vim.listCursor - 1);
                }
            }

            // ── vim: keyboard entry point ─────────────────────────────────────────

            function vimKeydown(e) {
                if (e.isComposing) return;
                // Shift on its way to $ or V is not a keystroke of its own —
                // letting it through would cancel every pending d, g or f.
                if (VIM_MODIFIERS[e.key]) return;
                var k = physKey(e);
                var ctrl = e.ctrlKey && !e.metaKey && !e.altKey;
                var L = LAY();

                if (el("overlay").classList.contains("open")) return; // the modal owns it

                // Panes answer from anywhere — insert mode, the filter, the list.
                if (ctrl && (k === L.left || k === L.right)) {
                    e.preventDefault();
                    gotoPane(k === L.left ? "list" : "editor");
                    return;
                }
                if ((e.metaKey || e.ctrlKey) && (k === "z" || k === "Z") && vim.on) {
                    if (!paraCount()) return;
                    e.preventDefault();
                    undoStep(k === "Z" || e.shiftKey);
                    return;
                }
                if (e.target === el("seek-input")) return; // has its own handlers
                if (e.target === el("filter")) return filterKeys(e);
                if (vim.pane === "list") return listKeys(e, k);
                if (!vim.on || !paraCount()) return;
                if (vim.mode === "insert") {
                    if (e.key === "Escape" || (ctrl && k === "[")) {
                        e.preventDefault();
                        leaveInsert();
                    }
                    return;
                }
                if (e.metaKey || e.altKey) return; // ⌘/alt combos stay the browser's

                var handled = handleKey(k, e);
                if (
                    handled ||
                    (!ctrl && e.key && e.key.length === 1) ||
                    e.key === "Enter" ||
                    e.key === "Backspace" ||
                    e.key === "Tab"
                )
                    e.preventDefault();
            }

            // ── vim: rendering hooks ──────────────────────────────────────────────

            function vimOnRender() {
                var wrap = el("paras").querySelector(".wrap");
                vim.tas = [];
                vim.caret = null;
                if (wrap) {
                    Array.prototype.forEach.call(
                        wrap.querySelectorAll(".para"),
                        function (box) {
                            vim.tas[Number(box.getAttribute("data-index"))] =
                                box.querySelector("textarea");
                        },
                    );
                    var caret = document.createElement("div");
                    caret.className = "vim-caret";
                    wrap.appendChild(caret);
                    vim.caret = caret;
                }
                vim.mode = "normal";
                vim.op = null;
                vim.opCount = "";
                vim.await = null;
                vim.awaitArg = false;
                vim.count = "";
                vim.keys = [];
                vim.anchor = null;
                vim.undo = [];
                vim.redo = [];
                vim.edit = null;
                vim.insert = null;
                vim.jumps = [];
                vim.jumpAt = -1;
                vim.para = 0;
                vim.off = 0;
                vim.goalX = null;
                VimMirror.drop();
                if (vim.toEditorAfterOpen) {
                    vim.toEditorAfterOpen = false;
                    gotoPane("editor");
                } else if (vim.pane === "editor") {
                    focusPara(0);
                }
                vimSync();
            }

            // ── vim: on / off, layout, help ───────────────────────────────────────

            function vimStore(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (err) {
                    /* private mode; the setting simply will not stick */
                }
            }

            function setVim(on) {
                vim.on = on;
                vimStore("redakcia:vim", on ? "1" : "0");
                el("btn-vim").textContent = on
                    ? "vim · " + LAY().label.replace(/ /g, "")
                    : "vim изключен";
                el("btn-vim").classList.toggle("act", on);
                if (!on) {
                    leaveVisual();
                    if (vim.mode === "insert") vim.mode = "normal";
                }
                vimBadge();
                if (on && vim.pane === "editor") {
                    focusPara(vim.para);
                    vimSync();
                } else drawCaret();
            }

            function setLayout(name) {
                if (!VIM_LAYOUTS[name]) return;
                vim.layout = name;
                vimStore("redakcia:vim-layout", name);
                setVim(vim.on);
                say("Клавишите са " + LAY().label + ".", "ok");
            }

            // ── vim: wiring ───────────────────────────────────────────────────────

            function vimInit() {
                try {
                    var saved = localStorage.getItem("redakcia:vim");
                    if (saved !== null) vim.on = saved === "1";
                    var lay = localStorage.getItem("redakcia:vim-layout");
                    if (lay && VIM_LAYOUTS[lay]) vim.layout = lay;
                } catch (err) {
                    /* no localStorage — defaults it is */
                }

                document.addEventListener("keydown", vimKeydown, true);

                // Nothing types into a textarea unless insert mode says so.
                el("paras").addEventListener("beforeinput", function (e) {
                    if (vim.on && vim.mode !== "insert" && e.inputType !== "insertFromPaste")
                        e.preventDefault();
                });
                // ⌘V is the one thing normal mode lets through, so it gets an
                // undo step of its own. In insert mode the session already
                // covers it.
                el("paras").addEventListener("paste", function () {
                    if (!vim.on || vim.mode === "insert") return;
                    beginEdit();
                    touch(vim.para);
                    setTimeout(function () {
                        var ta = vim.tas[vim.para];
                        if (ta) vim.off = Math.max(0, ta.selectionStart - 1);
                        commitEdit();
                        VimMirror.drop();
                        vimSync();
                    }, 0);
                });
                el("paras").addEventListener("mouseup", function (e) {
                    var ta = e.target && e.target.closest ? e.target.closest("textarea") : null;
                    if (!ta) return;
                    vim.pane = "editor";
                    paneClasses();
                    vim.para = Number(ta.parentNode.getAttribute("data-index"));
                    vim.off = ta.selectionStart;
                    vim.goalX = null;
                    if (vim.mode === "visual" || vim.mode === "vline") leaveVisual();
                    if (vim.mode !== "insert") vimSync();
                });
                el("ep-list").addEventListener("mousedown", function (e) {
                    var row = e.target.closest ? e.target.closest(".ep") : null;
                    if (!row) return;
                    var rows = el("ep-list").querySelectorAll(".ep");
                    for (var i = 0; i < rows.length; i++)
                        if (rows[i] === row) vim.listCursor = i;
                });
                el("seek-input").addEventListener("input", seekLive);
                el("seek-input").addEventListener("keydown", function (e) {
                    if (e.key === "Escape") {
                        e.preventDefault();
                        seekClose(true);
                    } else if (e.key === "Enter") {
                        e.preventDefault();
                        seekClose(false);
                    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                        e.preventDefault();
                        var h = vim.search.hist;
                        if (!h.length) return;
                        if (vim.search.histAt === undefined || vim.search.histAt < 0)
                            vim.search.histAt = h.length;
                        vim.search.histAt += e.key === "ArrowUp" ? -1 : 1;
                        vim.search.histAt = Math.max(
                            0,
                            Math.min(h.length - 1, vim.search.histAt),
                        );
                        el("seek-input").value = h[vim.search.histAt];
                        seekLive();
                    } else if (e.ctrlKey && (e.key === "[" || e.key === "c")) {
                        e.preventDefault();
                        seekClose(true);
                    }
                });
                window.addEventListener("resize", function () {
                    VimMirror.drop();
                    if (vim.mode !== "insert") vimSync();
                });
                el("btn-vim").addEventListener("click", function () {
                    setVim(!vim.on);
                });
                el("btn-keys").addEventListener("click", vimHelp);
                document.addEventListener("keydown", function (e) {
                    if (e.key === "F1") {
                        e.preventDefault();
                        vimHelp();
                    }
                });

                setVim(vim.on);
                paneClasses();
            }

            // ── wiring ──
            el("btn-save").addEventListener("click", function () {
                saveDraft(false);
            });
            el("btn-preview").addEventListener("click", function () {
                showPreview();
            });
            el("btn-publish").addEventListener("click", showPublish);
            el("btn-stamps").addEventListener("click", function () {
                var hidden = document.body.classList.toggle("hide-stamps");
                el("btn-stamps").textContent = hidden
                    ? "Покажи времената"
                    : "Скрий времената";
            });
            window.addEventListener("beforeunload", function (e) {
                if (dirtyEdits().length) {
                    e.preventDefault();
                    e.returnValue = "";
                }
            });

            api("/api/ping").then(function (p) {
                state.ping = p;
                el("repo").innerHTML =
                    (p.repo ? "<b>" + esc(p.repo) + "</b>" : "локална папка") +
                    " · клон <b>" +
                    esc(p.branch || "—") +
                    "</b> · публикува в <b>" +
                    esc(p.publish_branch) +
                    "</b>" +
                    (p.git ? "" : " · без git");
            });
            vimInit();
            loadEpisodes();
            if (location.hash.length > 1)
                openEpisode(decodeURIComponent(location.hash.slice(1)));
        </script>
    </body>
</html>
