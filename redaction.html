<!doctype html>
<html lang="bg">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="/static/favicon.ico" />
        <title>Светоглед — режим на редакция</title>
        <style>
            @font-face {
                font-family: "Forum";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(/static/fonts/forum-cyrillic.woff2) format("woff2");
            }
            @font-face {
                font-family: "Literata";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(/static/fonts/literata-cyrillic.woff2) format("woff2");
            }
            :root {
                --font-display: "Forum", Georgia, serif;
                --font-serif: "Literata", Georgia, serif;
                --bg: #0a0a0e;
                --bg-card: #161218;
                --bg-header: #100c14;
                --gold: #c8994c;
                --gold-soft: rgba(200, 153, 76, 0.14);
                --wine: #6b2038;
                --text: #e8e4e0;
                --text-dim: #b8b0a8;
                --text-dimmer: #8a8078;
                --line: rgba(255, 255, 255, 0.09);
                --ok: #7fc7b8;
                --warn: #e0955f;
                --bad: #d99aa8;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font-serif);
                font-size: 15px;
                line-height: 1.6;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            header {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 18px;
                background: var(--bg-header);
                border-bottom: 1px solid var(--line);
                flex: none;
            }
            header h1 {
                font-family: var(--font-display);
                font-size: 19px;
                font-weight: 400;
                color: var(--gold);
                letter-spacing: 0.5px;
                white-space: nowrap;
            }
            .repo {
                font-size: 12px;
                color: var(--text-dimmer);
            }
            .repo b {
                color: var(--text-dim);
                font-weight: 400;
            }
            .spacer {
                flex: 1;
            }
            button {
                font-family: var(--font-serif);
                font-size: 13px;
                padding: 7px 14px;
                border-radius: 18px;
                white-space: nowrap;
                border: 1px solid var(--line);
                background: rgba(255, 255, 255, 0.05);
                color: var(--text);
                cursor: pointer;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    opacity 0.15s;
            }
            button:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(200, 153, 76, 0.4);
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            button.primary {
                background: linear-gradient(135deg, var(--wine), #4a1528);
                border-color: rgba(200, 153, 76, 0.3);
                color: var(--gold);
            }
            button.ghost {
                background: transparent;
            }
            main {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            /* ── episode list ── */
            aside {
                width: 320px;
                flex: none;
                border-right: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                background: #0c0910;
            }
            .filter {
                padding: 10px;
                border-bottom: 1px solid var(--line);
            }
            .filter input {
                width: 100%;
                padding: 8px 12px;
                border-radius: 16px;
                border: 1px solid var(--line);
                background: rgba(255, 255, 255, 0.05);
                color: var(--text);
                font-family: var(--font-serif);
                font-size: 13px;
                outline: none;
            }
            .filter input:focus {
                border-color: rgba(200, 153, 76, 0.45);
            }
            .ep-list {
                overflow-y: auto;
                flex: 1;
            }
            .ep {
                padding: 9px 14px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                cursor: pointer;
                display: flex;
                gap: 8px;
                align-items: baseline;
            }
            .ep:hover {
                background: rgba(200, 153, 76, 0.07);
            }
            .ep.active {
                background: var(--gold-soft);
                border-left: 2px solid var(--gold);
            }
            .ep .num {
                color: var(--gold);
                font-size: 12px;
                flex: none;
                min-width: 34px;
            }
            .ep .t {
                font-size: 13px;
                line-height: 1.4;
                color: var(--text-dim);
            }
            .ep.active .t {
                color: var(--text);
            }
            .ep .badge {
                font-size: 10px;
                color: var(--warn);
                border: 1px solid rgba(224, 149, 95, 0.5);
                border-radius: 8px;
                padding: 0 5px;
                flex: none;
            }
            /* ── editor ── */
            section.editor {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .ed-head {
                padding: 12px 24px;
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: center;
                gap: 14px;
                flex: none;
            }
            .ed-head h2 {
                font-family: var(--font-display);
                font-size: 20px;
                font-weight: 400;
            }
            .ed-head .meta {
                font-size: 12px;
                color: var(--text-dimmer);
            }
            .ed-head a {
                color: var(--text-dimmer);
                font-size: 12px;
            }
            .paras {
                overflow-y: auto;
                flex: 1;
                padding: 24px 24px 120px;
            }
            .wrap {
                max-width: 780px;
                margin: 0 auto;
                position: relative; /* the vim caret is laid out against it */
            }
            .para {
                position: relative;
                margin-bottom: 14px;
                padding-left: 62px;
            }
            .para .stamp {
                position: absolute;
                left: 0;
                top: 9px;
                width: 52px;
                text-align: right;
                font-size: 11px;
                color: var(--text-dimmer);
                opacity: 0.55;
                font-variant-numeric: tabular-nums;
                user-select: none;
            }
            body.hide-stamps .para .stamp {
                visibility: hidden;
            }
            .para textarea {
                width: 100%;
                background: transparent;
                border: 1px solid transparent;
                border-radius: 8px;
                padding: 8px 12px;
                color: var(--text);
                font-family: var(--font-serif);
                font-size: 16px;
                line-height: 1.75;
                resize: none;
                overflow: hidden;
                outline: none;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            .para textarea:hover {
                background: rgba(255, 255, 255, 0.02);
            }
            .para textarea:focus {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(200, 153, 76, 0.35);
            }
            .para.dirty textarea {
                border-left: 2px solid var(--gold);
                background: rgba(200, 153, 76, 0.05);
            }
            .para .revert {
                position: absolute;
                right: -4px;
                top: 8px;
                font-size: 11px;
                color: var(--text-dimmer);
                background: none;
                border: none;
                cursor: pointer;
                display: none;
                padding: 2px 6px;
            }
            .para.dirty .revert {
                display: block;
            }
            .para .revert:hover {
                color: var(--gold);
                background: none;
            }
            /* ── vim ── */
            .para {
                z-index: 1; /* the block caret paints underneath the text */
            }
            .vim-caret {
                position: absolute;
                z-index: 0;
                display: none;
                border-radius: 2px;
                background: rgba(200, 153, 76, 0.42);
                pointer-events: none;
                transition:
                    left 0.06s ease-out,
                    top 0.06s ease-out,
                    width 0.06s ease-out;
            }
            .vim-caret.on {
                display: block;
            }
            .vim-caret.nofade {
                transition: none;
            }
            .vim-caret.thin {
                background: rgba(200, 153, 76, 0.7);
                width: 2px !important;
            }
            body.vim-block .para textarea {
                caret-color: transparent;
            }
            .para textarea::selection {
                background: rgba(200, 153, 76, 0.32);
                color: var(--text);
            }
            .para.vis textarea {
                background: rgba(200, 153, 76, 0.16);
            }
            .para.yanked textarea {
                background: rgba(127, 199, 184, 0.18);
            }
            /* The measuring twin: same box, same font, no eyes on it. */
            .vim-mirror {
                position: absolute;
                top: 0;
                left: -9999px;
                visibility: hidden;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                word-break: normal;
                box-sizing: border-box;
                border-style: solid;
                border-color: transparent;
                pointer-events: none;
                z-index: -1;
            }
            .vmode {
                flex: none;
                font-size: 10px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                padding: 2px 8px;
                border-radius: 10px;
                border: 1px solid var(--line);
                color: var(--gold);
                background: var(--gold-soft);
                border-color: rgba(200, 153, 76, 0.4);
            }
            .vmode.insert {
                color: var(--ok);
                background: rgba(127, 199, 184, 0.12);
                border-color: rgba(127, 199, 184, 0.45);
            }
            .vmode.visual {
                color: var(--warn);
                background: rgba(224, 149, 95, 0.12);
                border-color: rgba(224, 149, 95, 0.45);
            }
            .keys {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                color: var(--gold);
                opacity: 0.75;
                min-width: 34px;
                text-align: right;
            }
            .seek {
                display: none;
                align-items: center;
                gap: 6px;
                flex: 2;
            }
            .seek.on {
                display: flex;
            }
            .seek .sig {
                font-family: ui-monospace, monospace;
                color: var(--gold);
            }
            .seek input {
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                color: var(--text);
                font-family: var(--font-serif);
                font-size: 13px;
            }
            button.act {
                color: var(--gold);
                border-color: rgba(200, 153, 76, 0.4);
                background: var(--gold-soft);
            }
            .ep.cursor {
                background: rgba(200, 153, 76, 0.1);
                box-shadow: inset 0 0 0 1px rgba(200, 153, 76, 0.35);
            }
            aside.pane-on {
                box-shadow: inset -2px 0 0 rgba(200, 153, 76, 0.55);
            }
            aside.pane-on .ep.cursor {
                background: rgba(200, 153, 76, 0.18);
                box-shadow: inset 0 0 0 1px rgba(200, 153, 76, 0.7);
            }
            #ep-list:focus {
                outline: none;
            }
            .keys-grid {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 6px 14px;
                align-items: baseline;
                font-size: 13px;
            }
            .keys-grid kbd {
                justify-self: start;
                font-family: ui-monospace, monospace;
                font-size: 12px;
                color: var(--gold);
                background: rgba(200, 153, 76, 0.1);
                border: 1px solid rgba(200, 153, 76, 0.28);
                border-radius: 5px;
                padding: 1px 6px;
                white-space: nowrap;
            }
            .keys-sec {
                grid-column: 1 / -1;
                font-family: var(--font-display);
                font-size: 15px;
                color: var(--text-dim);
                margin-top: 14px;
                padding-bottom: 4px;
                border-bottom: 1px solid var(--line);
            }
            /* ── status bar ── */
            .status {
                flex: none;
                border-top: 1px solid var(--line);
                background: var(--bg-header);
                padding: 9px 18px;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 12px;
                color: var(--text-dim);
            }
            .status .msg {
                flex: 1;
                color: var(--text-dimmer);
            }
            .status .msg.ok {
                color: var(--ok);
            }
            .status .msg.bad {
                color: var(--bad);
            }
            .empty {
                margin: 80px auto;
                max-width: 460px;
                text-align: center;
                color: var(--text-dimmer);
            }
            .empty h3 {
                font-family: var(--font-display);
                font-size: 22px;
                font-weight: 400;
                color: var(--text-dim);
                margin-bottom: 10px;
            }
            /* ── modal ── */
            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(6, 4, 8, 0.78);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 30px;
                z-index: 50;
            }
            .overlay.open {
                display: flex;
            }
            .modal {
                background: var(--bg-card);
                border: 1px solid var(--line);
                border-radius: 14px;
                width: min(860px, 100%);
                max-height: 100%;
                display: flex;
                flex-direction: column;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            }
            .modal h3 {
                font-family: var(--font-display);
                font-weight: 400;
                font-size: 20px;
                padding: 16px 20px;
                border-bottom: 1px solid var(--line);
                color: var(--gold);
            }
            .modal .body {
                padding: 18px 20px;
                overflow-y: auto;
            }
            .modal .foot {
                padding: 14px 20px;
                border-top: 1px solid var(--line);
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .stat-row {
                display: flex;
                gap: 18px;
                flex-wrap: wrap;
                font-size: 13px;
                color: var(--text-dim);
                margin-bottom: 16px;
            }
            .stat-row b {
                color: var(--gold);
                font-weight: 400;
            }
            .dpara {
                border-left: 2px solid var(--line);
                padding: 6px 0 6px 14px;
                margin-bottom: 14px;
            }
            .dpara .dstamp {
                font-size: 11px;
                color: var(--text-dimmer);
                margin-bottom: 4px;
            }
            ins {
                background: rgba(127, 199, 184, 0.16);
                color: #b7e6db;
                text-decoration: none;
                border-radius: 3px;
                padding: 0 2px;
            }
            del {
                background: rgba(192, 100, 120, 0.16);
                color: #e2a9b5;
                border-radius: 3px;
                padding: 0 2px;
            }
            label.field {
                display: block;
                font-size: 12px;
                color: var(--text-dimmer);
                margin: 14px 0 6px;
            }
            .modal input[type="text"] {
                width: 100%;
                padding: 9px 12px;
                border-radius: 8px;
                border: 1px solid var(--line);
                background: rgba(255, 255, 255, 0.05);
                color: var(--text);
                font-family: var(--font-serif);
                font-size: 14px;
                outline: none;
            }
            .choice {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                padding: 10px 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                margin-bottom: 8px;
                cursor: pointer;
            }
            .choice.sel {
                border-color: rgba(200, 153, 76, 0.5);
                background: var(--gold-soft);
            }
            .choice .h {
                font-size: 14px;
            }
            .choice .d {
                font-size: 12px;
                color: var(--text-dimmer);
                line-height: 1.5;
            }
            .note {
                font-size: 12px;
                color: var(--text-dimmer);
                line-height: 1.6;
            }
            .result a {
                color: var(--gold);
            }
            .result code {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                color: var(--text-dim);
            }
        </style>
    </head>
    <body class="hide-stamps">
        <header>
            <h1>Режим на редакция</h1>
            <span class="repo" id="repo"></span>
            <span class="spacer"></span>
            <button
                class="ghost"
                id="btn-vim"
                title="Движение с клавиатурата — g? или F1 показва клавишите"
            >
                vim
            </button>
            <button class="ghost" id="btn-keys" title="Клавишите (g? или F1)">
                клавиши
            </button>
            <button class="ghost" id="btn-stamps" title="Показва времената само за ориентир">
                Покажи времената
            </button>
            <button id="btn-save" disabled>Запази чернова</button>
            <button id="btn-preview" disabled>Прегледай промените</button>
            <button class="primary" id="btn-publish" disabled>Публикувай</button>
        </header>

        <main>
            <aside>
                <div class="filter">
                    <input
                        type="text"
                        id="filter"
                        placeholder="Търсете беседа по име или номер…"
                    />
                </div>
                <div class="ep-list" id="ep-list" tabindex="-1"></div>
            </aside>

            <section class="editor">
                <div class="ed-head" id="ed-head" style="display: none">
                    <h2 id="ed-title"></h2>
                    <span class="meta" id="ed-meta"></span>
                    <span class="spacer"></span>
                    <a id="ed-yt" target="_blank" rel="noopener">YouTube ↗</a>
                    <a id="ed-site" target="_blank" rel="noopener">В сайта ↗</a>
                </div>
                <div class="paras" id="paras">
                    <div class="empty">
                        <h3>Изберете беседа</h3>
                        <p>
                            Текстът се редактира на абзаци — без времена. След
                            одобрение промяната отива в GitHub и пайплайнът
                            преизгражда и преиндексира епизода.
                        </p>
                    </div>
                </div>
                <div class="status">
                    <span class="vmode" id="vim-mode" hidden></span>
                    <span id="dirty-count">—</span>
                    <span class="msg" id="msg"></span>
                    <span class="seek" id="seek">
                        <span class="sig" id="seek-sig">/</span>
                        <input
                            id="seek-input"
                            spellcheck="false"
                            autocomplete="off"
                            aria-label="Търсене в беседата"
                        />
                    </span>
                    <span class="keys" id="vim-keys"></span>
                    <span id="autosave"></span>
                </div>
            </section>
        </main>

        <div class="overlay" id="overlay">
            <div class="modal">
                <h3 id="modal-title">Промени</h3>
                <div class="body" id="modal-body"></div>
                <div class="foot" id="modal-foot"></div>
            </div>
        </div>

        <script>
            var state = {
                episodes: [],
                current: null, // {video_id, paragraphs, ...}
                original: {}, // index -> original text
                edited: {}, // index -> edited text
                saveTimer: null,
                ping: null,
            };

            function el(id) {
                return document.getElementById(id);
            }
            function esc(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;",
                    }[c];
                });
            }
            function stamp(sec) {
                var s = Math.floor(sec || 0);
                var m = Math.floor(s / 60);
                return (
                    String(Math.floor(m / 60)) +
                    ":" +
                    String(m % 60).padStart(2, "0") +
                    ":" +
                    String(s % 60).padStart(2, "0")
                );
            }
            function say(text, kind) {
                var m = el("msg");
                m.textContent = text || "";
                m.className = "msg" + (kind ? " " + kind : "");
            }

            function api(path, payload) {
                var opts = payload
                    ? {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify(payload),
                      }
                    : {};
                return fetch(path, opts).then(function (r) {
                    return r.json().then(function (body) {
                        if (!r.ok || body.error)
                            throw new Error(body.error || "HTTP " + r.status);
                        return body;
                    });
                });
            }

            // ── episodes ──
            function loadEpisodes() {
                api("/api/episodes").then(function (data) {
                    state.episodes = data.episodes;
                    renderEpisodes();
                });
            }

            function renderEpisodes() {
                var q = el("filter").value.trim().toLowerCase();
                var list = state.episodes.filter(function (e) {
                    if (!q) return true;
                    return (
                        e.title.toLowerCase().indexOf(q) !== -1 ||
                        String(e.episode_number).indexOf(q) !== -1 ||
                        e.video_id.toLowerCase().indexOf(q) !== -1
                    );
                });
                vim.listIds = list.map(function (e) {
                    return e.video_id;
                });
                if (vim.listCursor >= list.length)
                    vim.listCursor = Math.max(0, list.length - 1);
                el("ep-list").innerHTML = list
                    .map(function (e, i) {
                        var active =
                            state.current &&
                            state.current.video_id === e.video_id;
                        return (
                            '<div class="ep' +
                            (active ? " active" : "") +
                            (i === vim.listCursor && vim.pane === "list"
                                ? " cursor"
                                : "") +
                            '" data-id="' +
                            esc(e.video_id) +
                            '"><span class="num">' +
                            (e.episode_number || "—") +
                            '</span><span class="t">' +
                            esc(e.title) +
                            "</span>" +
                            (e.has_draft
                                ? '<span class="badge">чернова</span>'
                                : "") +
                            "</div>"
                        );
                    })
                    .join("");
            }

            el("filter").addEventListener("input", function () {
                vim.listCursor = 0;
                renderEpisodes();
                listPaint(true);
            });
            el("ep-list").addEventListener("click", function (ev) {
                var row = ev.target.closest(".ep");
                if (row) openEpisode(row.getAttribute("data-id"));
            });

            // ── editor ──
            function dirtyEdits() {
                var out = [];
                Object.keys(state.edited).forEach(function (i) {
                    if (state.edited[i] !== state.original[i])
                        out.push({ index: Number(i), text: state.edited[i] });
                });
                return out;
            }

            function refreshDirty() {
                var n = dirtyEdits().length;
                el("dirty-count").textContent = n
                    ? n + (n === 1 ? " променен абзац" : " променени абзаца")
                    : "няма промени";
                el("btn-save").disabled = n === 0;
                el("btn-preview").disabled = n === 0;
                el("btn-publish").disabled = n === 0;
            }

            function openEpisode(id) {
                if (dirtyEdits().length && state.current &&
                    state.current.video_id !== id) {
                    if (!confirm(
                            "Имате незапазени промени в тази беседа. Да продължим ли?"))
                        return;
                }
                api("/api/episode?id=" + encodeURIComponent(id)).then(
                    function (data) {
                        state.current = data;
                        state.original = {};
                        state.edited = {};
                        data.paragraphs.forEach(function (p) {
                            state.original[p.index] = p.text;
                            state.edited[p.index] = p.text;
                        });
                        if (data.draft && data.draft.edits) {
                            data.draft.edits.forEach(function (e) {
                                if (state.original[e.index] !== undefined)
                                    state.edited[e.index] = e.text;
                            });
                            say(
                                "Заредена е чернова от " + data.draft.saved_at,
                                "ok",
                            );
                        } else {
                            say("");
                        }
                        location.hash = data.video_id;
                        renderEditor();
                        renderEpisodes();
                    },
                    function (err) {
                        say(err.message, "bad");
                    },
                );
            }

            function renderEditor() {
                var d = state.current;
                el("ed-head").style.display = "flex";
                el("ed-title").textContent = d.title;
                el("ed-meta").textContent =
                    d.paragraphs.length +
                    " абзаца · " +
                    d.segment_count +
                    " сегмента" +
                    (d.source ? " · " + d.source : "");
                el("ed-yt").href = d.youtube_url;
                el("ed-site").href = d.site_url;

                el("paras").innerHTML =
                    '<div class="wrap">' +
                    d.paragraphs
                        .map(function (p) {
                            var text = state.edited[p.index];
                            var dirty = text !== state.original[p.index];
                            return (
                                '<div class="para' +
                                (dirty ? " dirty" : "") +
                                '" data-index="' +
                                p.index +
                                '"><span class="stamp">' +
                                stamp(p.start) +
                                "</span>" +
                                '<textarea rows="1" spellcheck="true">' +
                                esc(text) +
                                "</textarea>" +
                                '<button class="revert" title="Върни оригинала">↺</button>' +
                                "</div>"
                            );
                        })
                        .join("") +
                    "</div>";

                el("paras")
                    .querySelectorAll("textarea")
                    .forEach(function (ta) {
                        autosize(ta);
                        ta.addEventListener("input", function () {
                            var i = Number(
                                ta.closest(".para").getAttribute("data-index"),
                            );
                            noteParaChange(i);
                            if (vim.mode === "insert")
                                vim.off = ta.selectionStart;
                        });
                    });
                el("paras")
                    .querySelectorAll(".revert")
                    .forEach(function (b) {
                        b.addEventListener("click", function () {
                            var box = b.closest(".para");
                            var i = Number(box.getAttribute("data-index"));
                            beginEdit();
                            setPara(i, state.original[i]);
                            commitEdit();
                            vimSync();
                        });
                    });
                refreshDirty();
                vimOnRender();
            }

            function autosize(ta) {
                ta.style.height = "auto";
                ta.style.height = ta.scrollHeight + "px";
            }

            // ── drafts ──
            function scheduleAutosave() {
                clearTimeout(state.saveTimer);
                el("autosave").textContent = "…";
                state.saveTimer = setTimeout(function () {
                    saveDraft(true);
                }, 2500);
            }

            function saveDraft(quiet) {
                if (!state.current) return Promise.resolve();
                var edits = dirtyEdits();
                if (!edits.length) {
                    el("autosave").textContent = "";
                    return api("/api/draft/discard", {
                        id: state.current.video_id,
                    }).catch(function () {});
                }
                return api("/api/draft", {
                    id: state.current.video_id,
                    edits: edits,
                }).then(
                    function (r) {
                        el("autosave").textContent =
                            "черновата е запазена " +
                            r.draft.saved_at.slice(11, 16);
                        if (!quiet) say("Черновата е запазена.", "ok");
                        var ep = state.episodes.filter(function (e) {
                            return e.video_id === state.current.video_id;
                        })[0];
                        if (ep && !ep.has_draft) {
                            ep.has_draft = true;
                            renderEpisodes();
                        }
                    },
                    function (err) {
                        el("autosave").textContent = "";
                        say("Черновата не се запази: " + err.message, "bad");
                    },
                );
            }

            // ── preview ──
            function openModal(title, body, foot) {
                el("modal-title").textContent = title;
                el("modal-body").innerHTML = body;
                el("modal-foot").innerHTML = "";
                (foot || []).forEach(function (b) {
                    el("modal-foot").appendChild(b);
                });
                el("overlay").classList.add("open");
            }
            function closeModal() {
                el("overlay").classList.remove("open");
            }
            el("overlay").addEventListener("click", function (e) {
                if (e.target === el("overlay")) closeModal();
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closeModal();
                if ((e.metaKey || e.ctrlKey) && e.key === "s") {
                    e.preventDefault();
                    saveDraft(false);
                }
            });

            function mkButton(label, cls, fn) {
                var b = document.createElement("button");
                b.textContent = label;
                if (cls) b.className = cls;
                b.addEventListener("click", fn);
                return b;
            }

            function diffHtml(diffs) {
                return diffs
                    .map(function (d) {
                        var inner = d.diff
                            .map(function (part) {
                                var t = esc(part.text);
                                if (part.op === "ins") return "<ins>" + t + "</ins>";
                                if (part.op === "del") return "<del>" + t + "</del>";
                                return t;
                            })
                            .join(" ");
                        return (
                            '<div class="dpara"><div class="dstamp">абзац ' +
                            (d.index + 1) +
                            " · " +
                            stamp(d.start) +
                            "</div>" +
                            inner +
                            "</div>"
                        );
                    })
                    .join("");
            }

            function showPreview(then) {
                var edits = dirtyEdits();
                if (!edits.length) return;
                say("Изчисляване на промените…");
                api("/api/preview", {
                    id: state.current.video_id,
                    edits: edits,
                }).then(
                    function (r) {
                        say("");
                        var s = r.summary;
                        var body =
                            '<div class="stat-row">' +
                            "<span><b>" +
                            s.paragraphs_changed +
                            "</b> " +
                            (s.paragraphs_changed === 1
                                ? "променен абзац"
                                : "променени абзаца") +
                            "</span>" +
                            "<span>думи: <b>" +
                            s.words_before +
                            "</b> → <b>" +
                            s.words_after +
                            "</b></span>" +
                            "<span>сегменти: <b>" +
                            s.segments_before +
                            "</b> → <b>" +
                            s.segments_after +
                            "</b></span>" +
                            "</div>" +
                            '<p class="note">Времената на сегментите остават същите — променя се само текстът в тях. Празните сегменти отпадат и времето им се слива със съседния.</p><br>' +
                            diffHtml(r.diffs);
                        openModal("Преглед на промените", body, [
                            mkButton("Затвори", "ghost", closeModal),
                            mkButton("Публикувай…", "primary", function () {
                                closeModal();
                                showPublish();
                            }),
                        ]);
                        if (then) then(r);
                    },
                    function (err) {
                        say(err.message, "bad");
                    },
                );
            }

            // ── publish ──
            function showPublish() {
                var edits = dirtyEdits();
                if (!edits.length) return;
                var branch = state.ping ? state.ping.publish_branch : "main";
                var title = state.current.title;
                var body =
                    '<p class="note">Промяната се записва в <code>transcripts/' +
                    esc(state.current.video_id) +
                    ".json</code>, комитва се и се качва в GitHub.</p>" +
                    '<label class="field">Съобщение на комита</label>' +
                    '<input type="text" id="commit-msg" value="' +
                    esc("Редакция на текста: " + title) +
                    '">' +
                    '<label class="field">Къде</label>' +
                    '<div class="choice sel" data-mode="direct"><div><div class="h">Директно в ' +
                    esc(branch) +
                    '</div><div class="d">Пайплайнът тръгва веднага: deploy.yml преизгражда сайта и преиндексира Meilisearch, regenerate-themes.yml обновява темите.</div></div></div>' +
                    '<div class="choice" data-mode="branch"><div><div class="h">В отделен клон + pull request</div><div class="d">Промяната изчаква преглед; пайплайнът тръгва след сливане.</div></div></div>';
                openModal("Публикуване", body, [
                    mkButton("Отказ", "ghost", closeModal),
                    mkButton("Публикувай", "primary", doPublish),
                ]);
                el("modal-body")
                    .querySelectorAll(".choice")
                    .forEach(function (c) {
                        c.addEventListener("click", function () {
                            el("modal-body")
                                .querySelectorAll(".choice")
                                .forEach(function (o) {
                                    o.classList.remove("sel");
                                });
                            c.classList.add("sel");
                        });
                    });
            }

            function doPublish() {
                var sel = el("modal-body").querySelector(".choice.sel");
                var mode = sel ? sel.getAttribute("data-mode") : "direct";
                var message = el("commit-msg").value.trim();
                var edits = dirtyEdits();
                el("modal-foot")
                    .querySelectorAll("button")
                    .forEach(function (b) {
                        b.disabled = true;
                    });
                say("Публикуване…");
                api("/api/publish", {
                    id: state.current.video_id,
                    edits: edits,
                    message: message,
                    mode: mode,
                    confirm: true,
                }).then(
                    function (r) {
                        var lines = [];
                        if (r.committed)
                            lines.push(
                                "Комит <code>" +
                                    esc(r.commit || "") +
                                    "</code> в <code>" +
                                    esc(r.branch || "") +
                                    "</code>.",
                            );
                        if (r.pushed) lines.push("Качено в GitHub.");
                        if (r.pipeline) lines.push(esc(r.pipeline));
                        if (r.pull_request_url)
                            lines.push(
                                '<a href="' +
                                    r.pull_request_url +
                                    '" target="_blank" rel="noopener">Отворете pull request ↗</a>',
                            );
                        if (r.actions_url)
                            lines.push(
                                '<a href="' +
                                    r.actions_url +
                                    '" target="_blank" rel="noopener">Проследете пайплайна ↗</a>',
                            );
                        if (r.error) lines.push("<b>" + esc(r.error) + "</b>");
                        if (r.warning) lines.push(esc(r.warning));
                        openModal(
                            r.ok ? "Публикувано" : "Частично публикувано",
                            '<div class="result note">' +
                                lines.join("<br><br>") +
                                "</div>",
                            [mkButton("Готово", "primary", closeModal)],
                        );
                        say(
                            r.ok
                                ? "Публикувано."
                                : "Публикувано частично — вижте съобщението.",
                            r.ok ? "ok" : "bad",
                        );
                        if (r.committed) reloadAfterPublish();
                    },
                    function (err) {
                        openModal(
                            "Грешка при публикуване",
                            '<div class="result note">' +
                                esc(err.message) +
                                "</div>",
                            [mkButton("Затвори", "ghost", closeModal)],
                        );
                        say(err.message, "bad");
                    },
                );
            }

            function reloadAfterPublish() {
                var id = state.current.video_id;
                state.edited = {};
                state.original = {};
                api("/api/episodes").then(function (data) {
                    state.episodes = data.episodes;
                    renderEpisodes();
                });
                api("/api/episode?id=" + encodeURIComponent(id)).then(
                    function (data) {
                        state.current = data;
                        data.paragraphs.forEach(function (p) {
                            state.original[p.index] = p.text;
                            state.edited[p.index] = p.text;
                        });
                        renderEditor();
                    },
                );
            }

            // ══ vim ═══════════════════════════════════════════════════════════════
            //
            // Keyboard-first редакция. Four things shape this code:
            //
            //   1. The motions live on the user's layout: j k l ; = left down up
            //      right. Every other key follows the same permutation (J is vim's H,
            //      K is vim's J…), so the muscle memory carries over whole.
            //   2. A paragraph *is* a line. Transcripts collapse into one long line
            //      per paragraph, so down/up walk display rows and step into the
            //      neighbouring paragraph at the edge; with an operator (dk) they go
            //      back to being linewise over whole paragraphs.
            //   3. Commands read the physical key, not the character it produced.
            //      Editing Bulgarian means the keyboard is on кирилица half the time,
            //      and normal mode has to survive that.
            //   4. Two panes: беседи | текст. Ctrl+j / Ctrl+; walk between them, and
            //      the list answers to the same k/l as the text does.
            //
            // The engine below is the only thing allowed to write into a textarea
            // outside of insert mode; everything it writes goes through setPara(),
            // which is what keeps черновата, the dirty marks and undo in step.

            // ── vim: pure text motions (unit-tested by test_vim_motions.js) ────────
            var VimText = (function () {
                var WORDCH = /[\p{L}\p{N}_]/u;
                var BLANK = /\s/;
                var SENT_END = /[.!?…]/;
                var CLOSERS = ")]}\"'“”„»›";
                var OPENERS = "([{<";
                var CLOSING = ")]}>";
                // Bulgarian prose quotes the typographic way; i" falls back to these.
                var QUOTE_PAIRS = [
                    ["„", "“"],
                    ["«", "»"],
                    ["“", "”"],
                ];

                /** 0 blank · 1 punctuation · 2 word. `big` folds 1 and 2 together. */
                function klass(ch, big) {
                    if (ch === undefined || ch === "") return 0;
                    if (BLANK.test(ch)) return 0;
                    if (big) return 1;
                    return WORDCH.test(ch) ? 2 : 1;
                }

                function lineStart(t, p) {
                    if (p <= 0) return 0;
                    var i = t.lastIndexOf("\n", p - 1);
                    return i < 0 ? 0 : i + 1;
                }

                function lineEnd(t, p) {
                    var i = t.indexOf("\n", Math.max(0, p));
                    return i < 0 ? t.length : i;
                }

                function firstNonBlank(t, p) {
                    var s = lineStart(t, p);
                    var e = lineEnd(t, p);
                    while (s < e && BLANK.test(t.charAt(s))) s++;
                    return s;
                }

                /** w / W — start of the next word. */
                function wordFwd(t, p, big) {
                    var n = t.length;
                    if (p >= n) return n;
                    var c = klass(t.charAt(p), big);
                    while (p < n && c !== 0 && klass(t.charAt(p), big) === c) p++;
                    while (p < n && klass(t.charAt(p), big) === 0) p++;
                    return p;
                }

                /** b / B — start of the word before the cursor. */
                function wordBack(t, p, big) {
                    p--;
                    while (p > 0 && klass(t.charAt(p), big) === 0) p--;
                    if (p <= 0) return 0;
                    var c = klass(t.charAt(p), big);
                    while (p > 0 && klass(t.charAt(p - 1), big) === c) p--;
                    return p;
                }

                /** e / E — last character of the word at or after the cursor. */
                function wordEnd(t, p, big) {
                    var n = t.length;
                    if (n === 0) return 0;
                    p++;
                    while (p < n && klass(t.charAt(p), big) === 0) p++;
                    if (p >= n) return n - 1;
                    var c = klass(t.charAt(p), big);
                    while (p + 1 < n && klass(t.charAt(p + 1), big) === c) p++;
                    return p;
                }

                /** ge / gE — last character of the previous word. */
                function wordEndBack(t, p, big) {
                    for (var q = p - 1; q > 0; q--) {
                        var a = klass(t.charAt(q), big);
                        if (a !== 0 && a !== klass(t.charAt(q + 1), big)) return q;
                    }
                    return 0;
                }

                /**
                 * f F t T. Returns -1 when the character is not on the line, so
                 * the command can fail the vim way — without moving anything.
                 *
                 * t standing right in front of its target jumps to the next one
                 * rather than refusing (vim's `cpo-=;`): otherwise repeating a
                 * t with ' sticks in place forever.
                 */
                function findChar(t, p, ch, backward, till, count) {
                    var ls = lineStart(t, p);
                    var le = lineEnd(t, p);
                    var i = p;
                    for (var c = 0; c < count; c++) {
                        var from = backward
                            ? i - (till && c === 0 ? 2 : 1)
                            : i + (till && c === 0 ? 2 : 1);
                        if (from < ls || from > le) return -1;
                        var k = backward
                            ? t.lastIndexOf(ch, from)
                            : t.indexOf(ch, from);
                        if (k < 0 || k < ls || k >= le) return -1;
                        i = k;
                    }
                    if (till) i = backward ? i + 1 : i - 1;
                    return i === p ? -1 : i;
                }

                /** % — the bracket matching the first one at or after the cursor. */
                function matchPair(t, p) {
                    var n = t.length;
                    var le = lineEnd(t, p);
                    var i = p;
                    while (
                        i < le &&
                        OPENERS.indexOf(t.charAt(i)) < 0 &&
                        CLOSING.indexOf(t.charAt(i)) < 0
                    )
                        i++;
                    if (i >= le) return -1;
                    var ch = t.charAt(i);
                    var oi = OPENERS.indexOf(ch);
                    var depth = 0;
                    var j;
                    if (oi >= 0) {
                        for (j = i; j < n; j++) {
                            if (t.charAt(j) === ch) depth++;
                            else if (t.charAt(j) === CLOSING.charAt(oi)) {
                                depth--;
                                if (depth === 0) return j;
                            }
                        }
                        return -1;
                    }
                    var ci = CLOSING.indexOf(ch);
                    for (j = i; j >= 0; j--) {
                        if (t.charAt(j) === ch) depth++;
                        else if (t.charAt(j) === OPENERS.charAt(ci)) {
                            depth--;
                            if (depth === 0) return j;
                        }
                    }
                    return -1;
                }

                /**
                 * Where every sentence in the text begins. A sentence ends on . ! ? …
                 * plus any closing quotes, then whitespace — the rule vim uses, which
                 * is also the rule Bulgarian prose follows.
                 */
                function sentenceStarts(t) {
                    var out = [0];
                    var n = t.length;
                    for (var i = 0; i < n; i++) {
                        if (!SENT_END.test(t.charAt(i))) continue;
                        var j = i + 1;
                        while (j < n && CLOSERS.indexOf(t.charAt(j)) >= 0) j++;
                        if (j >= n || !BLANK.test(t.charAt(j))) continue;
                        while (j < n && BLANK.test(t.charAt(j))) j++;
                        if (j < n && j !== out[out.length - 1]) out.push(j);
                        i = j - 1;
                    }
                    return out;
                }

                function sentenceFwd(t, p) {
                    var starts = sentenceStarts(t);
                    for (var i = 0; i < starts.length; i++)
                        if (starts[i] > p) return starts[i];
                    return t.length;
                }

                function sentenceBack(t, p) {
                    var starts = sentenceStarts(t);
                    var out = 0;
                    for (var i = 0; i < starts.length; i++)
                        if (starts[i] < p) out = starts[i];
                    return out;
                }

                // ── text objects ──
                // Each returns {start, end} as a half-open range, or null.

                function wordObject(t, p, inner, big) {
                    var n = t.length;
                    if (!n) return null;
                    if (p >= n) p = n - 1;
                    var c = klass(t.charAt(p), big);
                    var s = p;
                    var e = p;
                    while (s > 0 && klass(t.charAt(s - 1), big) === c) s--;
                    while (e + 1 < n && klass(t.charAt(e + 1), big) === c) e++;
                    if (inner) return { start: s, end: e + 1 };
                    var e2 = e + 1;
                    var s2 = s;
                    var grew = false;
                    while (e2 < n && klass(t.charAt(e2), big) === 0 && t.charAt(e2) !== "\n") {
                        e2++;
                        grew = true;
                    }
                    if (!grew)
                        while (
                            s2 > 0 &&
                            klass(t.charAt(s2 - 1), big) === 0 &&
                            t.charAt(s2 - 1) !== "\n"
                        )
                            s2--;
                    return { start: s2, end: e2 };
                }

                function sentenceObject(t, p, inner) {
                    var starts = sentenceStarts(t);
                    var s = 0;
                    var e = t.length;
                    for (var i = 0; i < starts.length; i++) {
                        if (starts[i] <= p) s = starts[i];
                        if (starts[i] > p) {
                            e = starts[i];
                            break;
                        }
                    }
                    if (inner) while (e > s && BLANK.test(t.charAt(e - 1))) e--;
                    return { start: s, end: e };
                }

                function paragraphObject(t, inner) {
                    var e = t.length;
                    if (inner) while (e > 0 && BLANK.test(t.charAt(e - 1))) e--;
                    return { start: 0, end: e };
                }

                function quoteObject(t, p, q, inner) {
                    var ls = lineStart(t, p);
                    var le = lineEnd(t, p);
                    var idx = [];
                    for (var i = ls; i < le; i++) if (t.charAt(i) === q) idx.push(i);
                    for (var k = 0; k + 1 < idx.length; k += 2) {
                        var a = idx[k];
                        var b = idx[k + 1];
                        if (p <= b)
                            return inner
                                ? { start: a + 1, end: b }
                                : { start: a, end: b + 1 };
                    }
                    return null;
                }

                function pairObject(t, p, open, close, inner) {
                    var n = t.length;
                    var depth = 0;
                    var s = -1;
                    var i;
                    for (i = p; i >= 0; i--) {
                        var ch = t.charAt(i);
                        if (ch === close && i < p) depth++;
                        else if (ch === open) {
                            if (depth === 0) {
                                s = i;
                                break;
                            }
                            depth--;
                        }
                    }
                    if (s < 0) return null;
                    depth = 0;
                    for (i = s + 1; i < n; i++) {
                        if (t.charAt(i) === open) depth++;
                        else if (t.charAt(i) === close) {
                            if (depth === 0)
                                return inner
                                    ? { start: s + 1, end: i }
                                    : { start: s, end: i + 1 };
                            depth--;
                        }
                    }
                    return null;
                }

                var PAIRS = {
                    "(": ["(", ")"],
                    ")": ["(", ")"],
                    b: ["(", ")"],
                    "[": ["[", "]"],
                    "]": ["[", "]"],
                    "{": ["{", "}"],
                    "}": ["{", "}"],
                    B: ["{", "}"],
                    "<": ["<", ">"],
                    ">": ["<", ">"],
                };

                /** iw aw iW aW is as ip ap i" a" i( a( … — one entry point. */
                function textObject(t, p, key, inner) {
                    if (key === "w") return wordObject(t, p, inner, false);
                    if (key === "W") return wordObject(t, p, inner, true);
                    if (key === "s") return sentenceObject(t, p, inner);
                    if (key === "p") return paragraphObject(t, inner);
                    if (key === '"' || key === "'" || key === "`") {

                    wordEndBack: wordEndBack,
                    findChar: findChar,

                    sentenceFwd: sentenceFwd,
                    sentenceBack: sentenceBack,

                    wordObject: wordObject,

            // ── end vim pure motions ──────────────────────────────────────────────

            // ── vim: layout, state ────────────────────────────────────────────────

            // either one.
            var VIM_LAYOUTS = {

                    down: "k",
                    up: "l",
                    right: ";",
                    high: "J",
                    join: "K",
                    low: ":",
                    again: "'",
                    back: ",",
                    label: "j k l ;",
                },
                hjkl: {
                    left: "h",
                    down: "j",
                    up: "k",
                    right: "l",
                    high: "H",
                    join: "J",
                    low: "L",
                    again: ";",
                    back: ",",
                    label: "h j k l",
                },
            };

            var vim = {
                on: true,
                layout: "jkl;",
                mode: "normal", // normal · insert · visual · vline
                para: 0,
                off: 0,
                goalX: null, // sticky column for down/up, in pixels
                anchor: null, // the fixed end of a visual selection
                count: "",
                op: null, // pending operator: d c y gu gU g~
                opCount: "",
                await: null, // function(key) waiting for the next keystroke
                awaitArg: false, // …and that key is a letter, not a command
                listAwait: null, // the same, for the episode list
                cmd: "", // what the status bar shows as typed so far
                reg: { text: "", linewise: false },
                find: null, // last f/F/t/T, for ' and ,
                search: { pat: "", dir: 1, hist: [], from: null },
                undo: [],
                redo: [],
                edit: null, // the change being assembled
                insert: null, // {para, before} while in insert mode
                change: null, // last change, replayed by .
                changeOpen: false, // …and it is still collecting typed text
                keys: [], // keys of the command being typed, for .
                replaying: false,
                jumps: [],
                jumpAt: -1,
                pane: "editor",
                listCursor: 0,
                listIds: [],
                toEditorAfterOpen: false,

                Period: ".>",
                Slash: "/?",

                BracketRight: "]}",
                Backslash: "\\|",
                Minus: "-_",
                Equal: "=+",
                Backquote: "`~",

            // ── vim: the mirror that knows where a character sits ─────────────────
            // A textarea will not say where its caret is on screen, and a paragraph
            // here is one long soft-wrapped line — so down/up have nothing to walk
            // unless we measure. A hidden div with the same box and the same font
            // wraps the same way; a Range over it hands back the geometry.
            var VimMirror = (function () {
                var host = null;
                var node = null;
                var key = "";
                var lines = { key: "", starts: [0] };
                var COPY = [
                    "fontFamily",
                    "fontSize",
                    "fontWeight",
                    "fontStyle",
                    "lineHeight",
                    "letterSpacing",
                    "wordSpacing",
                    "textIndent",
                    "textTransform",
                    "paddingTop",
                    "paddingRight",
                    "paddingBottom",
                    "paddingLeft",
                    "borderTopWidth",
                    "borderRightWidth",
                    "borderBottomWidth",
                    "borderLeftWidth",

                function sync(ta) {
                    if (!host) {
                        host = document.createElement("div");
                        host.className = "vim-mirror";

                    var cs = window.getComputedStyle(ta);
                    var k =
                        ta.offsetWidth +
                        "|" +
                        cs.fontSize +
                        "|" +
                        cs.lineHeight +
                        "|" +
                        cs.paddingLeft +
                        "|" +
                        ta.value;

                    for (var i = 0; i < COPY.length; i++) host.style[COPY[i]] = cs[COPY[i]];

                    // something to measure.

                    sync(ta);

                    var range = document.createRange();
                    range.setStart(node, i);
                    range.setEnd(node, i + 1);

                    var b = rects.length ? rects[0] : range.getBoundingClientRect();
                    var o = host.getBoundingClientRect();
                    return {
                        left: b.left - o.left,
                        top: b.top - o.top,
                        width: b.width,
                        height: b.height,

                function starts(ta) {
                    sync(ta);
                    if (lines.key === key) return lines.starts;
                    var n = ta.value.length;
                    var out = [0];
                    var at = 0;
                    var top = rectAt(ta, 0).top;
                    while (at < n) {
                        // Tops only ever grow with the index, so the first character of
                        // the next row is one bisection away.

                        var hi = n;
                        var found = -1;
                        while (lo <= hi) {

                                found = mid;
                                hi = mid - 1;
                            } else lo = mid + 1;

                        out.push(found);
                        at = found;
                        top = rectAt(ta, found).top;

                    key = "";
                    lines = { key: "", starts: [0] };
                }

                return { rectAt: rectAt, starts: starts, drop: drop };
            })();

            // ── vim: paragraphs, cursor, caret ────────────────────────────────────

            function paraCount() {
                return vim.tas.length;
            }

            function paraText(i) {
                var ta = vim.tas[i];

            function paraBox(i) {
                var ta = vim.tas[i];
                return ta ? ta.parentNode : null;
            }

            /** The rule for how far right the cursor may sit, per mode. */
            function maxOff(i) {
                var len = paraText(i).length;
                return vim.mode === "insert" ? len : Math.max(0, len - 1);
            }

            function dispLine(ta, off) {
                var s = VimMirror.starts(ta);
                var i = 0;
                while (i + 1 < s.length && s[i + 1] <= off) i++;

            function lineRange(ta, row) {

            /** The offset on display row `row` closest to pixel column `x`. */
            function offAtX(ta, row, x) {
                var r = lineRange(ta, row);
                var last = r.end;
                if (last > r.start && last < ta.value.length) last--; // the wrapping space
                var best = r.start;
                var bestD = Infinity;
                for (var i = r.start; i <= last; i++) {
                    var d = Math.abs(VimMirror.rectAt(ta, i).left - x);

                        best = i;

            function setCursor(p, o, keepGoal) {

                if (!keepGoal) vim.goalX = null;

            function focusPara(p) {

                // While / is open the prompt holds the keyboard: the cursor
                // walks the matches, the typing stays in the prompt.

            /** Selection, block caret, mode badge, scroll — everything the eye reads. */
            function vimSync() {

                // across the беседа should simply be *there*.

                    "nofade",
                    !was ||
                        was.para !== vim.para ||
                        Math.abs(top - was.pageTop) > 3 * (r.height || 20),

            // ── vim: the visual selection ─────────────────────────────────────────

                        inside && (vim.mode === "vline" || i > r.from.para) && i < r.to.para,

            // ── vim: writing into the text ────────────────────────────────────────

            /** Everything the editor already does when a paragraph changes. */

                    changes: changes,

                    // not back where the command happened to start.

                        para: changes[0].i,

                var at = redo ? e.after : e.before;

            // ── vim: motions over the whole беседа ────────────────────────────────
            // A motion answers with {para, off, kind}. `kind` is what an operator

            function moveVert(dir, count) {
                var p = vim.para;
                var o = vim.off;
                var ta = vim.tas[p];
                if (!ta) return;
                if (vim.goalX === null) vim.goalX = VimMirror.rectAt(ta, o).left;
                var x = vim.goalX;
                for (var c = 0; c < count; c++) {

                    var rows = VimMirror.starts(ta).length;
                    if (dir > 0) {
                        if (row + 1 < rows) o = offAtX(ta, row + 1, x);
                        else if (p + 1 < paraCount()) {
                            p++;
                            ta = vim.tas[p];
                            o = offAtX(ta, 0, x);
                        } else {
                            o = Math.max(0, ta.value.length - 1);
                            break;
                        }
                    } else {
                        if (row > 0) o = offAtX(ta, row - 1, x);
                        else if (p > 0) {
                            p--;
                            ta = vim.tas[p];
                            o = offAtX(ta, VimMirror.starts(ta).length - 1, x);
                        } else {
                            o = 0;
                            break;
                        }
                    }
                }
                setCursor(p, o, true);
